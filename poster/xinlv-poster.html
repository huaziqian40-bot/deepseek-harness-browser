<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>心履 · 海报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    background: #0d1119;
    color: #eef2ff;
  }
  .art { position: relative; width: 900px; height: 1000px; flex: none; overflow: hidden; background: linear-gradient(160deg, #16233a, #0d1119); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,17,25,0) 62%, rgba(13,17,25,.92) 100%); }
  .panel {
    flex: 1; position: relative; padding: 86px 76px 70px; display: flex; flex-direction: column;
    background: radial-gradient(120% 90% at 100% 0%, #1d2b47 0%, #0d1119 62%);
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 46px; }
  .orb { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, #ff9a3d, #ff6a3d); box-shadow: 0 8px 26px rgba(255,122,61,.45); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .brand b { font-size: 22px; letter-spacing: 3px; }
  .brand span { font-size: 13px; color: #8fa0c0; letter-spacing: 1px; }
  h1 { font-size: 66px; line-height: 1.16; font-weight: 900; letter-spacing: 2px; background: linear-gradient(100deg, #ffffff 12%, #ffc79a 52%, #7fb0ff 96%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { margin-top: 20px; font-size: 24px; font-weight: 500; color: #b9c8e6; letter-spacing: 1px; }
  .rule { width: 92px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #ff9a3d, #ff6a3d); margin: 34px 0 40px; }
  .points { display: flex; flex-direction: column; gap: 26px; }
  .pt { display: flex; gap: 16px; align-items: flex-start; }
  .dot { flex: none; width: 34px; height: 34px; border-radius: 11px; background: rgba(255,154,61,.14); border: 1px solid rgba(255,154,61,.42); display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .pt .t { font-size: 21px; font-weight: 800; letter-spacing: .5px; }
  .pt .d { font-size: 15px; color: #93a3c4; margin-top: 5px; line-height: 1.5; }
  .cta { margin-top: auto; display: flex; align-items: center; gap: 18px; }
  .btn { padding: 17px 34px; border-radius: 14px; font-size: 19px; font-weight: 800; color: #1b1206; background: linear-gradient(135deg, #ffb457, #ff7a3d); box-shadow: 0 14px 34px rgba(255,122,61,.34); }
  .cta small { font-size: 13px; color: #7c8bab; line-height: 1.6; }
</style>
</head>
<body>
  <div class="art">
    <img id="hero" src="poster-bg.jpg" alt="主视觉"
         onerror="this.style.display='none';document.querySelector('.art').style.background='linear-gradient(160deg,#24304a,#0d1119)';" />
  </div>
  <div class="panel">
    <div class="brand">
      <div class="orb">👣</div>
      <div>
        <b>心履</b>
        <div><span>XINLV · 跨设备同步</span></div>
      </div>
    </div>
    <h1>心履同步<br />全端无界</h1>
    <h2>一套账号，电脑手机自动同步</h2>
    <div class="rule"></div>
    <div class="points">
      <div class="pt">
        <div class="dot">🔑</div>
        <div>
          <div class="t">账号全端通用</div>
          <div class="d">台式机、笔记本、办公电脑，一套账号登录</div>
        </div>
      </div>
      <div class="pt">
        <div class="dot">🔄</div>
        <div>
          <div class="t">数据自动同步</div>
          <div class="d">选课、课表、日程、AI 会话，换设备即接续</div>
        </div>
      </div>
      <div class="pt">
        <div class="dot">🔒</div>
        <div>
          <div class="t">本地加密上传</div>
          <div class="d">云端仅存密文，服务器看不到任何明文</div>
        </div>
      </div>
    </div>
    <div class="cta">
      <div class="btn">即刻开启心履同步</div>
      <small>端到端加密<br />密钥只在你手里</small>
    </div>
  </div>
</body>
</html>
